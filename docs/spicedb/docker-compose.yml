services:
  spicedb-postgres:
    image: postgres:15
    container_name: spicedb-postgres
    environment:
      POSTGRES_DB: spicedb
      POSTGRES_USER: spicedb
      POSTGRES_PASSWORD: spicedb
    volumes:
      - spicedb_pgdata:/var/lib/postgresql/data
    networks:
      - spicedb-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spicedb"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  spicedb-migrate:
    image: authzed/spicedb
    container_name: spicedb-migrate
    command: datastore migrate head
    networks:
      - spicedb-net
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: "postgres://spicedb:spicedb@spicedb-postgres:5432/spicedb?sslmode=disable"
    depends_on:
      spicedb-postgres:
        condition: service_healthy
    restart: "no"

  spicedb:
    image: authzed/spicedb
    container_name: spicedb
    command:
      - serve
      - --http-enabled
      - --grpc-preshared-key
      - "test"
      - --datastore-engine
      - postgres
      - --datastore-conn-uri
      - "postgres://spicedb:spicedb@spicedb-postgres:5432/spicedb?sslmode=disable"
    ports:
      - "50051:50051"
      - "8443:8443"
    networks:
      - spicedb-net
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  spicedb-net:
    driver: bridge

volumes:
  spicedb_pgdata:
